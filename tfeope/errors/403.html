<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 Forbidden | TFEOPE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #10284a;
      background: linear-gradient(135deg, #f8fafc, #f1d38a);
    }
    main {
      width: min(620px, 100%);
      padding: 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(16, 40, 74, 0.12);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    }
    img { width: 82px; height: 82px; object-fit: contain; }
    p.code { margin: 18px 0 8px; color: #b8871f; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 64px); line-height: 1; }
    p { color: #475569; line-height: 1.7; }
    a { display: inline-block; margin-top: 12px; padding: 12px 16px; border-radius: 8px; color: #fff; background: #10284a; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="TFEOPE logo">
    <p class="code">403 Error</p>
    <h1>Access denied</h1>
    <p>This page is protected or the server permissions do not allow access.</p>
    <a href="/">Go Home</a>
  </main>
</body>
</html>
