# Add this inside the HTTPS server block for tfoepe-inc.com.ph.
# Add the same location block inside admin.tfoepe-inc.com.ph if the admin build is deployed with /client-api.

location /client-api/ {
    proxy_pass https://api.tfoepe-inc.com.ph/;

    proxy_set_header Host api.tfoepe-inc.com.ph;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
}
